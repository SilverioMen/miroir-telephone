<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miroir Téléphone</title>
<style>
  :root { --fond:#ffffff; --texte:#1f2933; --discret:#52606d; --accent:#0b6e4f; }
  @media (prefers-color-scheme: dark) { :root { --fond:#161b1f; --texte:#e4e7eb; --discret:#9aa5b1; --accent:#4cc38a; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--fond); color: var(--texte);
    font: 16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; text-align: center; }
  #attente img { width: 260px; height: 260px; background: #fff; border-radius: 12px; padding: 8px; }
  #etat { margin: 12px 0 0; color: var(--discret); }
  #attente.cache, #direct.cache { display: none; }
  #direct { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  video { max-width: 100%; max-height: 100%; background: #000; }
  #debug { position: fixed; left: 8px; bottom: 8px; padding: 4px 8px; background: rgba(0,0,0,.7); color: #fff;
    font: 12px ui-monospace, monospace; border-radius: 6px; display: none; }
</style>
</head>
<body>
<main>
  <section id="attente">
    <img id="qr" alt="QR code à scanner avec l'appli Android" src="/qr.svg">
    <p id="etat">En attente du téléphone</p>
  </section>
  <section id="direct" class="cache">
    <video id="video" autoplay muted playsinline></video>
  </section>
</main>
<div id="debug"></div>
<script src="/receiver.js"></script>
</body>
</html>
